<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Lê Comigo</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>
    <div id="header">
        <h1><strong>Lê Comigo</strong></h1>
        <p>Aprender, compreender e transformar.</p>
    </div>

    <div id="menu">
        <a href="index.html">Início</a>
        <a href="atividades.html">Atividades</a>
        <a href="sobre.html">Sobre</a>
        <a href="login.html">Login</a>
    </div>

    <div id="main">
        <h2>Bem-vindo!</h2>
        <p>
            Crie sua conta para salvar seu progresso.
        </p>

        <form action="#" method="post">
            <label for="nome">Nome:</label>
            <br>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">

            <br>
            <br>

            <label for="email">E-mail:</label>
            <br>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

            <br>
            <br>

            <label for="senha">Criar senha:</label>
            <br>
            <input type="password" id="senha" name="senha" placeholder="Crie sua senha" required>

            <br><br>

            <button type="submit">Cadastrar-se</button>

        </form>

    </div>

    <div id="footer">
        <p><strong>Lê Comigo</strong></p>
        <p>Uma plataforma de aprendizagem da leitura e escrita para adultos.</p>
        <p>© 2026 Lê Comigo</p>
    </div>
</body>

</html>
